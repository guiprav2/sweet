[package]
name = "sweet-php"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI for using sweet-core from PHP FFI"

[lib]
name = "sweet_php"
crate-type = ["cdylib"]

[dependencies]
sweet-core = { path = "../sweet-core" }
winit = { version = "0.30", path = "../../vendor/winit", default-features = false, features = ["x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
softbuffer = "0.4"
